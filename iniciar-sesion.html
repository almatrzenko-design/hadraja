<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Hadrajá</title>
    <meta name="description" content="Hadrajá: ideas para madrijim, por madrijim.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="pantalla">

    <a href="index.html" class="volver">← Volver</a>

    <h1 class="pantalla-titulo">Iniciar sesión</h1>
    <p class="pantalla-bajada">¡Qué bueno verte de nuevo!</p>

    <form class="formulario" id="form-login" novalidate>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="tunombre@gmail.com">

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" placeholder="Tu contraseña">

        <p id="error-login" class="error-login" role="alert"></p>

        <button type="submit" class="boton boton-principal">Entrar</button>

    </form>

    <p class="texto-ayuda">Cuenta de prueba: <strong>miri@gmail.com</strong> · contraseña <strong>hadraja123</strong></p>

    <p class="cambiar-cuenta">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>

</main>

<script>
    const formLogin = document.getElementById('form-login');
    const cartelError = document.getElementById('error-login');

    formLogin.addEventListener('submit', function (evento) {
        evento.preventDefault();

        const email = document.getElementById('email').value.trim().toLowerCase();
        const contrasena = document.getElementById('contrasena').value;

        // Las cuentas registradas. Si no está la de prueba, la agregamos.
        const cuentas = JSON.parse(localStorage.getItem('cuentas')) || [];
        if (!cuentas.some(function (c) { return c.email === 'miri@gmail.com'; })) {
            cuentas.push({
                nombre: 'Miri', email: 'miri@gmail.com', contrasena: 'hadraja123',
                grupo: 'Kvutzá Arazim', janijim: '9 a 11 años', edad: '18 a 20 años', seguidores: 48
            });
            localStorage.setItem('cuentas', JSON.stringify(cuentas));
        }

        const cuenta = cuentas.find(function (c) { return c.email === email; });

        let error = '';
        if (email === '' || contrasena === '') {
            error = 'Completá tu mail y tu contraseña.';
        } else if (!cuenta) {
            error = 'No hay ninguna cuenta con ese mail. Si sos nueva/o, registrate.';
        } else if (cuenta.contrasena !== contrasena) {
            error = 'La contraseña no es correcta.';
        }

        if (error !== '') {
            cartelError.textContent = error;
            cartelError.style.display = 'block';
            cartelError.scrollIntoView({ block: 'center' });
            return;
        }

        // Entró: anotamos el nombre de la cuenta y la sesión
        localStorage.setItem('nombre', cuenta.nombre);
        localStorage.setItem('sesion', cuenta.email);

        location.href = 'feed.html';
    });
</script>
</body>
</html>
