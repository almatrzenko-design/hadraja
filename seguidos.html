<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguidos | Hadrajá</title>
    <meta name="description" content="Hadrajá: ideas para madrijim, por madrijim.">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/sesion.js"></script>
</head>
<body>
<main class="pantalla con-barra">

    <h1 class="pantalla-titulo">¡Hola, <span id="saludo-nombre">Miri</span>!</h1>
    <p class="pantalla-bajada">Lo último de la gente que seguís.</p>

    <nav class="pestanias">
        <a href="feed.html" class="pestania">Sugerencias</a>
        <a href="seguidos.html" class="pestania activa" aria-current="page">Seguidos</a>
    </nav>

    <p id="sin-seguidos" class="sin-seguidos">Todavía no seguís a nadie. Tocá <strong>Seguir</strong> en las ideas de Sugerencias para ver acá lo que publican.</p>

    <div id="lista-seguidos"></div>

</main>

<nav class="barra-abajo" aria-label="Navegación principal">
    <a href="feed.html" class="barra-item activo" aria-current="page">
        <span class="barra-icono" aria-hidden="true">🏠</span>
        <span>Inicio</span>
    </a>
    <a href="explorar.html" class="barra-item">
        <span class="barra-icono" aria-hidden="true">🔍</span>
        <span>Explorar</span>
    </a>
    <a href="publicar.html" class="barra-item barra-publicar">
        <span class="barra-icono" aria-hidden="true">＋</span>
        <span>Publicar</span>
    </a>
    <a href="guardadas.html" class="barra-item">
        <span class="barra-icono" aria-hidden="true">🔖</span>
        <span>Guardadas</span>
    </a>
    <a href="mi-perfil.html" class="barra-item">
        <span class="barra-icono" aria-hidden="true">👤</span>
        <span>Perfil</span>
    </a>
</nav>

<script src="js/ejemplos.js"></script>
<script src="js/publicaciones.js"></script>
<script>
    const cuenta = cuentaActual();
    if (cuenta) {
        document.getElementById('saludo-nombre').textContent = cuenta.nombre;
    }

    // Las ideas (de ejemplo y publicadas) de la gente que seguís
    const listaSeguidos = JSON.parse(localStorage.getItem('seguidos')) || [];
    const publicadas = JSON.parse(localStorage.getItem('publicaciones')) || [];
    const ideasSeguidas = EJEMPLOS.concat(publicadas).filter(function (idea) {
        return listaSeguidos.includes(idea.autor);
    });

    if (ideasSeguidas.length === 0) {
        document.getElementById('sin-seguidos').style.display = 'block';
    }

    document.getElementById('lista-seguidos').innerHTML = ideasSeguidas.map(tarjetaHTML).join('');
</script>
<script src="js/guardar.js"></script>
<script src="js/megusta.js"></script>
<script src="js/comentarios.js"></script>
</body>
</html>
