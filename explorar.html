<script src="js/ejemplos.js"></script>
<script src="js/publicaciones.js"></script>
<script>
    // ===== El buscador =====

    // Las ideas de ejemplo están en js/ejemplos.js (EJEMPLOS)

    // Saca tildes y mayúsculas: así "pesaj" encuentra "Pésaj"
    function normalizar(texto) {
        return String(texto || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    }

    const buscador = document.getElementById('buscador');
    const zonaCategorias = document.getElementById('categorias');
    const zonaResultados = document.getElementById('resultados');

    buscador.addEventListener('input', function () {
        const busqueda = normalizar(buscador.value.trim());

        // Si el buscador está vacío, volvemos a mostrar las categorías
        if (busqueda === '') {
            zonaCategorias.style.display = 'grid';
            zonaResultados.innerHTML = '';
            return;
        }
        zonaCategorias.style.display = 'none';

        // Juntamos las de ejemplo con las publicadas
        const publicadas = JSON.parse(localStorage.getItem('publicaciones')) || [];
        const todas = EJEMPLOS.concat(publicadas);

        const encontradas = todas.filter(function (idea) {
            const subcategorias = (idea.subcategorias || []).join(' ');
            const texto = normalizar(idea.titulo + ' ' + idea.descripcion + ' ' + categorias[idea.categoria].nombre + ' ' + subcategorias);
            return texto.includes(busqueda);
        });

        if (encontradas.length === 0) {
            zonaResultados.innerHTML = '<p class="buscador-aviso">No encontramos nada con "' + limpiar(buscador.value) + '". Probá con otra palabra.</p>';
            return;
        }

        zonaResultados.innerHTML = '<p class="buscador-aviso">' + encontradas.length + ' resultados</p>' +
            encontradas.map(tarjetaHTML).join('');

        // Las tarjetas nuevas también tienen que tener me gusta, guardar y comentarios
        prepararBotones();
        pintarGuardadas();
        prepararCorazones();
        pintarCorazones();
        prepararGlobitos();
        pintarGlobitos();
    });
</script>
<script src="js/guardar.js"></script>
<script src="js/megusta.js"></script>
<script src="js/comentarios.js"></script>
</body>
</html>
